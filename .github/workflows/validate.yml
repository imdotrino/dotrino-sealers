name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - name: Pruebas del validador
        run: npm test
      - name: Solo se añade, y la cadena verifica
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pr.mjs "origin/${{ github.base_ref }}"
